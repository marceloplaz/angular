<div class="row g-3 align-items-center p-3 bg-light rounded shadow-sm" [formGroup]="filtroForm">
 <!-- GESTIÓN -->
<div class="col-md-2" [formGroup]="filtroForm">
  <label class="form-label fw-bold">Gestión:</label>
  <select class="form-select" formControlName="gestion" (change)="onFiltroCambio()">
    <option *ngFor="let g of listaGestiones" [value]="g.anio">
      {{ g.anio }}
    </option>
  </select>
</div>
        
   

 
  <div class="col-md-3">
    <label class="form-label fw-bold">Mes:</label>
    <select class="form-select" formControlName="mes_id" (change)="onFiltroCambio()">
      @for (mes of listaMeses; track mes.id) {
        <option [value]="mes.id">{{ mes.nombre }}</option>
      }
    </select>
  </div>

  <!-- CATEGORÍA -->
  <div class="col-md-3">
    <label class="form-label fw-bold">Categoría:</label>
    <select class="form-select" formControlName="categoria_id" (change)="onFiltroCambio()">
      <option value="">Todas las categorías</option>
      @for (cat of listaCategorias; track cat.id) {
        <option [value]="cat.id">{{ cat.nombre }}</option>
      }
    </select>
  </div>

  <!-- SEMANA DINÁMICA -->
  <div class="col-md-4">
    <label class="form-label fw-bold">Semana:</label>
    <select class="form-select" formControlName="semana_id" (change)="onSemanaChange($event)">
      @for (sem of listaSemanas; track sem.id) {
        <option [value]="sem.id">{{ sem.etiqueta }}</option>
      }
    </select>
  </div>

  <!-- Bloque para generar las semanas de ese mes/categoría -->
<div class="row g-3 align-items-end mt-3 p-3 bg-white rounded shadow-sm border" [formGroup]="generarForm">
  <div class="col-md-3">
    <label class="form-label fw-bold">Fecha Inicio (Lunes):</label>
    <input type="date" class="form-control" formControlName="fecha_inicio">
  </div>

  <div class="col-md-3">
    <label class="form-label fw-bold">Fecha Fin (Domingo):</label>
    <input type="date" class="form-control" formControlName="fecha_fin">
  </div>

  <div class="col-md-4">
    <button type="button" class="btn btn-success w-100" (click)="ejecutarGeneracionSemanas()">
      <i class="fas fa-calendar-plus me-2"></i> Generar Semanas para este Mes
    </button>
  </div>
</div>

</div>
