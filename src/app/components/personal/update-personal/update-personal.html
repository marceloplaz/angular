<div class="card shadow-sm border-success mb-4">
  <div class="card-header bg-success text-white">
    <h5 class="mb-0 fw-bold">Modificar Personal y Credenciales de Usuario</h5>
  </div>
  
  <div class="card-body">
    <form [formGroup]="updateForm" (ngSubmit)="actualizarPersonal()">
      
      <!-- SECCIÓN: DATOS DE ACCESO (Tabla Users) -->
      <h6 class="text-success fw-bold border-bottom pb-2 mb-3">
        <i class="fas fa-user-lock me-2"></i> Credenciales de Acceso
      </h6>
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nombre de Usuario (Login):</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Ej. jairo">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Correo Electrónico:</label>
          <input type="email" class="form-control" formControlName="email" placeholder="correo@test.com">
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">
            Contraseña <small class="text-muted fw-normal">(Déjalo en blanco si no deseas cambiarla)</small>:
          </label>
          <input type="password" class="form-control" formControlName="password" placeholder="Nueva contraseña opcional">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Rol en el Sistema (Categoría):</label>
          <select class="form-select" formControlName="categoria_id">
            <option value="">Seleccione un rol...</option>
            <option *ngFor="let cat of listaCategorias" [value]="cat.id">
              {{ cat.nombre || cat.name }}
            </option>
          </select>
        </div>
      </div>

      <!-- SECCIÓN: INFORMACIÓN PERSONAL (Tabla Personas) -->
      <h6 class="text-success fw-bold border-bottom pb-2 mb-3">
        <i class="fas fa-id-card me-2"></i> Información Personal
      </h6>
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Nombre Completo:</label>
          <input type="text" class="form-control" formControlName="nombre_completo">
          <div *ngIf="updateForm.get('nombre_completo')?.invalid && updateForm.get('nombre_completo')?.touched" class="text-danger small mt-1">
            El nombre completo es obligatorio.
          </div>
        </div>
             <div class="col-md-6">
            <label class="form-label">Carnet de Identidad:</label>
            <input type="text" class="form-control" formControlName="carnet_identidad">
            <div *ngIf="updateForm.get('carnet_identidad')?.invalid && updateForm.get('carnet_identidad')?.touched" class="text-danger small mt-1">
                El carnet de identidad es obligatorio.
            </div>
            </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Fecha de Nacimiento:</label>
          <input type="date" class="form-control" formControlName="fecha_nacimiento">
        </div>
        <div class="col-md-4">
          <label class="form-label">Género:</label>
          <select class="form-select" formControlName="genero">
            <option value="">Seleccione...</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Teléfono / Celular:</label>
          <input type="text" class="form-control" formControlName="telefono">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Dirección:</label>
          <input type="text" class="form-control" formControlName="direccion">
        </div>
        <div class="col-md-6">
          <label class="form-label">Nacionalidad:</label>
          <input type="text" class="form-control" formControlName="nacionalidad">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Tipo de Trabajador:</label>
          <input type="text" class="form-control" formControlName="tipo_trabajador">
        </div>
        <div class="col-md-4">
          <label class="form-label">Tipo de Salario:</label>
          <input type="text" class="form-control" formControlName="tipo_salario" placeholder="Ej. TGN, SUS, Contrato">
        </div>
        <div class="col-md-4">
          <label class="form-label">N° Tipo Salario:</label>
          <input type="text" class="form-control" formControlName="numero_tipo_salario">
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label">Fecha de Ingreso a la Institución:</label>
          <input type="date" class="form-control" formControlName="fecha_ingreso_institucion">
        </div>
      </div>

      <!-- BOTONES DE ACCIÓN -->
      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary px-4" (click)="cancelar()">
          <i class="fas fa-times me-1"></i> Cancelar
        </button>
        <button type="submit" class="btn btn-success px-4" [disabled]="updateForm.invalid">
          <i class="fas fa-save me-1"></i> Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
